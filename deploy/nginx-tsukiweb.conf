# tsuki-re web port — nginx, split deployment.
#
#   code:  tsuki-re.fate-custom-wars.ru         (this repo, git pull)
#   media: media.tsuki-re.fate-custom-wars.ru   (unpacked dist: assets/, scenes/)
#
# First setup:
#   1. certbot --nginx -d tsuki-re.fate-custom-wars.ru -d media.tsuki-re.fate-custom-wars.ru
#      (certbot writes the ssl_certificate lines; the paths below are its
#      defaults — adjust if yours differ, then nginx -t && systemctl reload nginx)
#   2. Code root: git clone <repo> /var/www/tsuki-re/code
#   3. Media root: the unpacked dist (assets/ + scenes/ only — no player
#      files needed there). Symlinks to the unpacked tree work too.
#   4. cp /var/www/tsuki-re/code/deploy/media-base.json /var/www/tsuki-re/code/media-base.json
#      (once — git pull never overwrites it unless the repo changes it)
#   5. cp deploy/update.sh /usr/local/bin/tsuki-re-update.sh && chmod +x it,
#      and run it (or a cron / webhook) on every push.
#
# Why two domains: the media tree is ~23 GB and never changes under a
# code deploy, so it stays out of the repo entirely. The player reads
# media-base.json from the code root and prefixes every assets/ and
# scenes/ request with it. Local setups (Windows junctions, file://)
# have no media-base.json at the root and keep working unchanged.

server {
  listen 80;
  server_name tsuki-re.fate-custom-wars.ru media.tsuki-re.fate-custom-wars.ru;
  return 301 https://$host$request_uri;
}

# ---- player code: never cached, so a git pull reaches players at once ----
server {
  listen 443 ssl;
  server_name tsuki-re.fate-custom-wars.ru;
  ssl_certificate /etc/letsencrypt/live/tsuki-re.fate-custom-wars.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tsuki-re.fate-custom-wars.ru/privkey.pem;

  root /var/www/tsuki-re/code;
  index index.html;

  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache, must-revalidate";
  }
}

# ---- unpacked media: CORS for the code origin, cached hard ----
# The player fetches scenes/*.json (fetch), decodes audio through
# WebAudio (fetch), and draws images to canvas (Image) — all three
# need Access-Control-Allow-Origin, or the canvas taints and scene
# JSON fails to load. NOTE: nginx drops server-level add_header when
# a location sets its own, so the CORS header lives in the location.
server {
  listen 443 ssl;
  server_name media.tsuki-re.fate-custom-wars.ru;
  ssl_certificate /etc/letsencrypt/live/media.tsuki-re.fate-custom-wars.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/media.tsuki-re.fate-custom-wars.ru/privkey.pem;

  root /var/www/tsuki-re/media;

  location / {
    try_files $uri =404;
    add_header Access-Control-Allow-Origin "https://tsuki-re.fate-custom-wars.ru" always;
    # unpacked files never change under a code deploy
    add_header Cache-Control "public, max-age=31536000, immutable";
    # video seeking and audio ranges work out of the box (nginx ranges)
  }
}
